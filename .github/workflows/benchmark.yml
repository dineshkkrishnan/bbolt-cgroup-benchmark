name: bbolt benchmark validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve Go modules and generate checksums
        run: go mod tidy

      - name: Verify module checksums
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Show Linux environment
        run: |
          uname -a
          free -h
          cat /proc/self/cgroup
          go version

      - name: Upload generated go.sum
        uses: actions/upload-artifact@v4
        with:
          name: go-sum
          path: go.sum
