name: Phase 4.2 file_storage cache sensitivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - name: Checkout upstream filestorage
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/open-telemetry/opentelemetry-collector-contrib.git upstream
          (cd upstream && git sparse-checkout set extension/storage/filestorage && git rev-parse HEAD > ../upstream-commit.txt)
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false
      - name: Compile integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch results
          cp phase4/filestorage_phase41_test.go upstream/extension/storage/filestorage/phase41_integration_test.go
          cp phase4/filestorage_phase42_test.go upstream/extension/storage/filestorage/phase42_integration_test.go
          (cd upstream/extension/storage/filestorage && GOWORK=off CGO_ENABLED=0 go test -c -o "$GITHUB_WORKSPACE/scratch/filestorage-cache.test" .)
          cp upstream-commit.txt results/upstream-commit.txt
          { uname -a; go version; docker info --format 'Cgroup: {{.CgroupVersion}}'; } > results/environment.txt
          test "$(docker info --format '{{.CgroupVersion}}')" = "2"
      - name: Seed both freelist formats on host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch/seeds
          for persist in false true; do
            PHASE41_MODE=seed PHASE41_PERSIST="$persist" PHASE41_DB="$PWD/scratch/seeds/$persist.db" \
              ./scratch/filestorage-cache.test -test.run '^TestPhase41SeedOrRecover$' -test.v -test.timeout 20m > "results/seed-$persist.log" 2>&1
            sha256sum "scratch/seeds/$persist.db" > "results/seed-$persist.sha256"
          done
      - name: Compare warm and advisory-cold startup
        shell: bash
        run: |
          set -euo pipefail
          docker pull ubuntu:24.04
          # Two replicates per cell; reverse cache order on second replicate.
          for repeat in 1 2; do
            if (( repeat == 1 )); then caches=(cold warm); else caches=(warm cold); fi
            for mib in 1024 256; do
              for persist in false true; do
                for cache in "${caches[@]}"; do
                  id="r${repeat}-${mib}-${persist}-${cache}"
                  mkdir -p "scratch/work-$id" "results/$id"
                  cp "scratch/seeds/$persist.db" "scratch/work-$id/collector.db"
                  docker run --rm --network none --memory "${mib}m" --memory-swap "${mib}m" \
                    -e PHASE42_CACHE="$cache" -e PHASE42_CASE="$id" -e PHASE42_PERSIST="$persist" \
                    -e PHASE42_DB=/work/collector.db \
                    -v "$PWD/scratch:/bench:ro" -v "$PWD/scratch/work-$id:/work:rw" \
                    -v "$PWD/results/$id:/out:rw" \
                    --entrypoint /bench/filestorage-cache.test ubuntu:24.04 \
                    -test.run '^TestPhase42CacheControlledOpen$' -test.v -test.timeout 10m \
                    > "results/$id/test.log" 2>&1
                  rm -f "scratch/work-$id/collector.db"
                done
              done
            done
          done
      - name: Parse measured open latency and I/O
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,statistics
          from pathlib import Path
          root=Path("results")
          samples=[]
          for path in sorted(root.glob("r*-*/test.log")):
              m=re.search(r'PHASE42_RESULT (\{[^\n]+\})',path.read_text())
              if not m: raise RuntimeError(f"Missing measurement: {path}")
              samples.append(json.loads(m.group(1)))
          assert len(samples)==16, f"Expected 16 results, got {len(samples)}"
          groups={}
          for s in samples:
              limit=s["case"].split("-")[1]
              key=f"{limit}MiB_persisted_{s['persisted_seed']}_{s['cache_protocol']}"
              groups.setdefault(key,[]).append(s["open_ms"])
          assert len(groups)==8 and all(len(v)==2 for v in groups.values())
          summary={"samples":samples,"median_open_ms":{k:statistics.median(v) for k,v in groups.items()},
                   "warning":"Advisory FADV_DONTNEED is not guaranteed cold cache; inspect major faults and per-device I/O before interpreting cold-vs-warm."}
          (root/"phase42-summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary["median_open_ms"],indent=2))
          PY
      - name: Upload raw results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbolt-phase4-2-cache-results
          path: results/
          retention-days: 14
