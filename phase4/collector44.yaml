extensions:
  file_storage:
    directory: /var/lib/otelcol/queue
    timeout: 30s
    compaction:
      on_start: false
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp:
    endpoint: http://127.0.0.1:19090
    encoding: json
    timeout: 2s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000
      num_consumers: 1

service:
  extensions: [file_storage, health_check]
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlphttp]
